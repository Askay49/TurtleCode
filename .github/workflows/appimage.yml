name: Build packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu 22.04 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-22.04-arm
            arch: aarch64
            deb_arch: arm64
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-12 g++-12 ninja-build pkg-config python3-venv dpkg-dev \
            qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev qt6-wayland libqt6svg6 \
            libgl1-mesa-dev libfontconfig-dev \
            libpcre2-dev libsqlite3-dev libgit2-dev libtree-sitter-dev libeditorconfig-dev libssl-dev \
            curl ca-certificates file desktop-file-utils patchelf
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/pip" install 'cmake==3.31.6'
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"

      - name: Configure Release build
        run: |
          if cmake -S . -B build/appimage -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
              -DBUILD_TESTING=ON > "$RUNNER_TEMP/configure.log" 2>&1; then
            cat "$RUNNER_TEMP/configure.log"
          else
            cat "$RUNNER_TEMP/configure.log"
            tail -n 50 "$RUNNER_TEMP/configure.log" | sed 's/^/::error title=CMake configuration::/'
            exit 1
          fi

      - name: Build application and tests
        run: cmake --build build/appimage --target turtle-code turtle-code-tests --parallel 2

      - name: Test application
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/appimage --output-on-failure -LE memory

      - name: Package AppImage
        env:
          APPIMAGE_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash packaging/build-appimage.sh build/appimage dist

      - name: Package universal DEB and Linux tarball
        run: |
          bash packaging/build-deb.sh 'dist/Turtle_Code-${{ matrix.arch }}.AppImage' dist
          cpack --config build/appimage/CPackConfig.cmake -B dist -G TGZ

      - name: Upload portable Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            dist/Turtle_Code-${{ matrix.arch }}.AppImage
            dist/Turtle_Code-${{ matrix.arch }}.AppImage.sha256
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload universal DEB
        uses: actions/upload-artifact@v7
        with:
          name: release-deb-${{ matrix.deb_arch }}
          path: dist/*_${{ matrix.deb_arch }}.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  verify-deb:
    name: DEB on ${{ matrix.image }} (${{ matrix.arch }})
    needs: ubuntu
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04', 'debian:13']
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-deb-${{ matrix.arch }}
          path: dist

      - name: Install DEB and start Turtle Code
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          shopt -s nullglob
          packages=(dist/*.deb)
          test "${#packages[@]}" -eq 1
          package="./${packages[0]}"
          test "$(dpkg-deb -f "$package" Architecture)" = "$(dpkg --print-architecture)"
          apt-get update
          apt-get install --no-install-recommends -y "$package"

          version=$(dpkg-deb -f "$package" Version)
          version=${version%-*}
          app_home=$(mktemp -d)
          chown nobody "$app_home"
          actual=$(runuser -u nobody -- env HOME="$app_home" XDG_RUNTIME_DIR="$app_home" \
            QT_QPA_PLATFORM=offscreen timeout 30 /usr/bin/turtle-code --version)
          printf '%s\n' "$actual"
          test "$actual" = "Turtle Code v$version"

          for elf in /usr/lib/turtle-code/lib/*.so* /usr/lib/turtle-code/plugins/*/*.so; do
            libraries=$(LC_ALL=C ldd "$elf")
            if [[ $libraries == *'not found'* ]]; then
              printf '%s\n%s\n' "$elf" "$libraries" >&2
              exit 1
            fi
          done

  fedora:
    name: Fedora 44 (x86_64)
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 35
    steps:
      - name: Install build and packaging dependencies
        run: |
          dnf -y install git gcc-c++ cmake ninja-build pkgconf-pkg-config rpm-build \
            qt6-qtbase-devel fontconfig-devel pcre2-devel sqlite-devel libgit2-devel libtree-sitter-devel editorconfig-devel

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and package Fedora RPM
        run: |
          cmake -S . -B build/fedora -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/fedora --parallel 2
          cpack --config build/fedora/CPackConfig.cmake -B dist -G RPM
          dnf -y install ./dist/*.rpm
          QT_QPA_PLATFORM=offscreen /usr/bin/turtle-code --version

      - uses: actions/upload-artifact@v7
        with:
          name: release-fedora-44-x86_64
          path: dist/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  arch:
    name: Arch Linux (x86_64)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 35
    steps:
      - name: Install build and packaging dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja pkgconf qt6-base fontconfig pcre2 sqlite libgit2 tree-sitter editorconfig-core-c

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and verify Arch package
        shell: bash
        run: |
          useradd --create-home package-builder
          package_dir=$(mktemp -d)
          git -c safe.directory="$GITHUB_WORKSPACE" archive --prefix=turtle-code/ \
            --format=tar.gz --output="$package_dir/turtle-code.tar.gz" HEAD
          version=$(sed -nE 's/^project\(TurtleCode VERSION ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' CMakeLists.txt)
          test -n "$version"
          source_sha256=$(sha256sum "$package_dir/turtle-code.tar.gz" | cut -d ' ' -f 1)
          sed -e "s/@VERSION@/$version/" -e "s/@SOURCE_SHA256@/$source_sha256/" \
            packaging/arch/PKGBUILD.in > "$package_dir/PKGBUILD"
          chown -R package-builder:package-builder "$package_dir"
          (cd "$package_dir" && runuser -u package-builder -- makepkg --noconfirm)
          mkdir -p dist
          cp "$package_dir"/*.pkg.tar.zst dist/
          pacman -U --noconfirm ./dist/*.pkg.tar.zst
          QT_QPA_PLATFORM=offscreen /usr/bin/turtle-code --version

      - uses: actions/upload-artifact@v7
        with:
          name: release-arch-x86_64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build and packaging dependencies
        run: brew install cmake ninja pkgconf qtbase pcre2 sqlite libgit2 tree-sitter editorconfig

      - name: Build and package macOS app
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          qt=$(brew --prefix qtbase)
          export PKG_CONFIG_PATH="$(brew --prefix pcre2)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix libgit2)/lib/pkgconfig"
          cmake -S . -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$qt;$(brew --prefix tree-sitter);$(brew --prefix editorconfig)"
          cmake --build build/macos --parallel 2
          bash packaging/macos/build-packages.sh build/macos dist "$qt/bin/macdeployqt"

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.app.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [ubuntu, verify-deb, fedora, arch, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish packages and checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check -- *.AppImage.sha256
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" .
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes -- *
